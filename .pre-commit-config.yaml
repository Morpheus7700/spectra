# Local commit-time guards — the control that runs on a human's `git commit`.
#
# `.claude/hooks/guard_secrets.py` is a Claude Code PreToolUse hook: it constrains what the
# AI writes and nothing else — it cannot see a terminal. This file is the only guard that
# sits between a human keystroke and the object store, and it is the only one that can stop
# a key BEFORE it is pushed: the gitleaks job in ci.yml scans the same rules over the full
# history, but by the time it speaks the key is public and must be rotated, not reverted.
# Two controls, deliberately, because this one is bypassed by `--no-verify`.
#
#   pipx install pre-commit  (or: uv tool install pre-commit)
#   pre-commit install
#
# BUDGET: the whole run stays under two seconds, measured. That is a design constraint, not
# an accident. Nothing slow may move in here:
#   - pytest is deliberately absent. It is 6.6 s today and heads for ~25 s as the accuracy
#     gate expands. A hook that punishes committing teaches `--no-verify`, and a bypassed
#     hook protects less than no hook at all. The suite belongs in CI, where waiting is free.
#   - `ruff format` is deliberately absent. This codebase keeps a compact hand-maintained
#     style (several fields per line in constructor calls); reformatting now would rewrite
#     git blame across every file and catch no defect.
#
# Revisions verified against upstream releases on 2026-08-21. ruff is pinned to the exact
# version uv.lock resolves, so the hook and CI cannot disagree about what counts as an error.

repos:
  # Secrets first: if this fires, nothing else about the commit matters.
  # Scans the staged diff only, so a gitignored .env full of live keys is never read.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4 # == ruff in uv.lock
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      # .gitattributes (`* text=auto eol=lf`) already normalises what git stores; this keeps
      # the working tree agreeing with it, which is what shebangs and the JSON fixtures see.
      - id: mixed-line-ending
        args: [--fix=lf]

  # mypy last: it is the most expensive hook here (0.7 s) and the least likely to fire,
  # so everything cheaper gets to fail first.
  #
  # A local hook, not mirrors-mypy. The mirror would need pydantic/numpy/scipy re-pinned as
  # additional_dependencies — a second dependency list drifting silently from uv.lock — and
  # still would not reproduce the mypy_path in pyproject.toml. This calls the project env, so
  # the hook and CI type-check against exactly the same versions.
  #
  # It was commented out until c4f1edb because openai, google-genai and scipy-stubs were
  # installed in one developer's .venv and declared nowhere, which made it red on every other
  # machine. That is fixed: all three are in pyproject.toml, so `uv run mypy` is reproducible
  # from a clean `uv sync --locked`. A hook that fails for reasons unrelated to your commit is
  # how `--no-verify` becomes muscle memory — that was the objection, and it no longer holds.
  #
  # Same string as CI and as CLAUDE.md. If those three ever diverge, this is the copy to fix.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, project env)
        entry: uv run mypy packages tools .claude/hooks
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
