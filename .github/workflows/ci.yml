name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A superseded PR run tells us nothing. Cancel it; never cancel main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Do not stop the Windows leg because Linux failed, or vice versa.
      # Dev is Windows, deploy is Linux; when they disagree we need both reports.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # --locked, not --frozen. `uv sync --help` (uv 0.7.20) is explicit:
      #   --locked  "Assert that the `uv.lock` will remain unchanged"
      #   --frozen  "Sync without updating the `uv.lock` file"
      # --frozen installs the lock as-is and stays SILENT when pyproject.toml has
      # drifted past it. --locked is the flag that fails loudly on a stale lock,
      # which is the behaviour this gate is here for. Both refuse to rewrite the
      # lockfile, so --locked is strictly the stronger choice.
      - name: Install dependencies (fails if uv.lock is stale)
        run: uv sync --locked

      # ---------------------------------------------------------------------
      # Steps below are ordered by COST, cheapest first, so the fastest check
      # that can fail is the one that fails. Measured on this project:
      # ruff ~0.1s, mypy ~0.7s, then the suites.
      #
      # DO NOT MOVE mypy BELOW THE TESTS.
      # That ordering is not a stylistic preference. mypy caught a latent crash
      # here that all 166 passing tests missed: scipy.least_squares can return a
      # sparse matrix or LinearOperator for `.jac`, and an untested code path
      # consumed it as a dense ndarray. Types found it; the suite did not.
      # A type error on this codebase is evidence of a real defect, and it costs
      # 0.7s to learn about it instead of several minutes.
      # ---------------------------------------------------------------------

      # adapters/ is included even though adapters/windows_wlan is Windows-only. It guards
      # itself with a module-level `sys.platform != "win32"` raise, which mypy honours by
      # treating the rest as unreachable on Linux, and its tests carry a skipif. So the
      # Linux leg still lints and type-checks the parts it can reach rather than ignoring
      # a whole package.
      - name: Lint (ruff)
        run: uv run ruff check packages tools adapters .claude/hooks

      - name: Types (mypy)
        run: uv run mypy packages tools adapters .claude/hooks

      # Both tools/export_fixtures.py and apps/web/src/scene/SiteScene.tsx tell
      # the reader that "CI regenerates it and fails on any diff". Until now
      # nothing did, so the one guarantee that keeps the web fixture from
      # drifting away from the Python domain models was documentation. This is
      # that check, and it runs on BOTH legs of the matrix on purpose: the
      # exporter writes the file, and "the same generator produces different
      # bytes on Windows" is precisely this project's recurring bug class.
      - name: Fixture freshness (site.json still matches the domain models)
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m tools.export_fixtures
          if ! git --no-pager diff --exit-code apps/web/public/fixtures; then
            echo "::error file=apps/web/public/fixtures/site.json::Fixture is stale. Regenerate with 'uv run python -m tools.export_fixtures' and commit the result."
            exit 1
          fi

      - name: Tests (excluding accuracy)
        run: uv run pytest -q -m "not accuracy"

      # The `accuracy` marker does not exist yet; it is being added in a separate
      # workstream. Until it lands, `-m accuracy` collects nothing and pytest
      # exits 5. We treat 5 as a pass so this file can merge ahead of the marker.
      #
      # 5 is the ONLY tolerated non-zero code. 1 (failures), 2 (interrupted),
      # 3 (internal error) and 4 (usage error) all still fail the job, so this
      # cannot quietly swallow a real accuracy regression.
      #
      # R14: the summary is written on SUCCESS as well as failure. A gate that
      # only speaks when it is angry gets ignored, and a vacuous pass that looks
      # identical to a real one is worse than no gate at all — so the summary
      # states plainly which of the two happened.
      - name: Accuracy gate
        shell: bash
        run: |
          set -uo pipefail

          set +e
          uv run pytest -q -m accuracy 2>&1 | tee accuracy-output.txt
          status=${PIPESTATUS[0]}
          set -e

          {
            echo "## Accuracy gate — ${{ matrix.os }} / Python ${{ matrix.python-version }}"
            echo
            case "$status" in
              0)
                echo "**PASS** — accuracy tests ran and passed."
                ;;
              5)
                echo "**PASS (vacuous)** — pytest exited 5: no tests matched \`-m accuracy\`."
                echo
                echo "The \`accuracy\` marker is not defined yet, so this gate currently"
                echo "protects nothing. It starts gating the moment the marker lands —"
                echo "no workflow change required."
                ;;
              *)
                echo "**FAIL** — pytest exited $status."
                ;;
            esac
            echo
            echo "<details><summary>pytest output</summary>"
            echo
            echo '```'
            cat accuracy-output.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" -eq 0 ] || [ "$status" -eq 5 ]; then
            exit 0
          fi
          exit "$status"

  # ---------------------------------------------------------------------------
  # Secret scanning, server-side.
  #
  # Until now the only secret scanning was `.pre-commit-config.yaml` (staged diff)
  # and `.claude/hooks/guard_secrets.py` (what Claude writes). Neither survives
  # `git commit --no-verify`, and neither runs on a push from a machine where the
  # hooks were never installed. This job is the only control that sees what
  # actually reached the remote — and it is the one control where being late is
  # unrecoverable: a key in a pushed commit is a rotated key, not a reverted one.
  #
  # Pinned to v8.30.1, the same revision as the pre-commit hook, so the local and
  # server checks cannot disagree about what counts as a leak. Installed from the
  # release tarball against its published SHA-256 rather than via
  # gitleaks/gitleaks-action, which requires a paid GITLEAKS_LICENSE for repos
  # owned by an organisation — i.e. it would fail on the day this repo moves off
  # a personal account, for reasons unrelated to any commit.
  #
  # `gitleaks git` reads commits (`git log -p`) and never the working tree, so a
  # gitignored .env full of live keys is not read. Verified, not assumed.
  # `--redact` keeps every matched value out of the log; `-v` still prints rule,
  # file, line and commit, which is what you need in order to rotate the key and
  # rewrite history (R19).
  # ---------------------------------------------------------------------------
  secrets:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # fetch-depth: 0 — a key introduced three commits ago is still live. The
      # default shallow checkout would scan only the tip and report clean.
      - name: Checkout (full history)
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks 8.30.1 (== .pre-commit-config.yaml)
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      # Exits 1 on any finding. ~0.2 s over the whole history today.
      - name: Scan commit history
        run: "$RUNNER_TEMP/gitleaks git --redact -v --no-banner ."

  # ---------------------------------------------------------------------------
  # Web build. Ubuntu only, deliberately.
  #
  # The Python matrix is dual-OS because that split is this project's recurring
  # bug (path separators, line endings) and because the engine has to run on
  # both. Nothing in this job is OS-shaped: npm resolves the same tracked
  # package-lock.json everywhere, tsc and vite are platform-agnostic, and the
  # artifact that actually ships is built on Linux. A Windows leg would double
  # the minutes to re-test node's own portability, which is not our defect to
  # find. It is a separate job rather than steps in `check` for the same reason:
  # it shares no state with the Python work, needs no uv sync, and a red web
  # build should not hide behind a Python matrix name.
  # ---------------------------------------------------------------------------
  web:
    name: web build (node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Pinned to the exact version on the development machine, so a failure here
      # reproduces locally instead of becoming "works on my node". Both declared
      # engine ranges are satisfied: vite 8 wants ^20.19 || >=22.12, vitest 4
      # wants ^20 || ^22 || >=24 — note the hole at 23, which is why `lts/*` or
      # `latest` would be a live trap here rather than a convenience.
      - name: Install node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # ci, not install: it installs the lockfile exactly and fails if
      # package.json and package-lock.json have drifted. The npm analogue of
      # `uv sync --locked` above.
      - name: Install dependencies (fails if package-lock.json is stale)
        run: npm ci

      # Same cost ordering as the Python job: types before tests before build.
      - name: Types (tsc --noEmit)
        run: npm run typecheck

      # `npm test` is `vitest run`, and there are zero test files today, in which
      # case vitest exits 1 with "No test files found". --passWithNoTests is
      # vitest's own flag for exactly that case: it changes the exit code of an
      # EMPTY run and nothing else, so a failing test still fails this job. That
      # is the difference between it and `|| true`, which would swallow real
      # failures silently.
      #
      # The flag goes inert the moment the first *.test.ts lands — this step
      # starts gating with no edit to this file. If you want "somebody deleted
      # every test" to be a red build, delete the flag once tests exist.
      - name: Tests (vitest)
        run: npm test -- --passWithNoTests

      - name: Build (tsc -b && vite build)
        run: npm run build
