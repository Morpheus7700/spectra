[project]
name = "spectra"
version = "0.1.0"
description = "WiFi 3D spatial awareness platform"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    # Type-checked but previously undeclared. mypy checks tools/council/seats.py, which
    # imports both SDKs, and multilateration.py, which needs scipy stubs. They were
    # present in one developer's .venv and in neither pyproject.toml nor uv.lock, so
    # `uv run mypy` was red on every other machine including CI. Declared here rather
    # than as runtime deps because the council is build-time tooling only (R19).
    "openai>=3.3",
    "google-genai>=2.19",
    "scipy-stubs>=1.18",
]

[tool.pytest.ini_options]
pythonpath = ["packages/core", "packages/engine", "packages/sim", "."]
testpaths = ["packages", "tools", "adapters", ".claude/hooks"]
filterwarnings = ["error"]
# Registered here and applied in the same change, deliberately: filterwarnings = ["error"]
# turns PytestUnknownMarkWarning into a hard failure, so a marker applied before it is
# registered reds the suite. CI runs `-m "not accuracy"` and `-m accuracy` as separate
# steps; before this marker existed the second step collected nothing and exited 5, which
# both workflows reported as "PASS (vacuous)" -- an honest name for a gate protecting
# nothing. The gate itself was running all along, inside the "not accuracy" step.
markers = [
    "accuracy: the numerical regression gate -- slow (~18s), seeded, and the only tests whose thresholds are claims about how wrong the engine is",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "packages/core:packages/engine:packages/sim:.claude/hooks"
exclude = ['/tests/', 'test_.*\.py$']
